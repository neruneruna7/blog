<!doctype html>
<html lang="{{ page.site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.article.config.title }} | {{ page.site.title }}</title>
  <meta name="description" content="{{ page.article.config.description }}">
  <link rel="canonical" href="{{ page.canonical_url }}">
  <meta property="og:title" content="{{ page.article.config.title }}">
  <meta property="og:description" content="{{ page.article.config.description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ page.ogp_url }}">
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <header><a href="/">{{ page.site.title }}</a></header>
  <main>
    <article>
      <h1>{{ page.article.config.title }}</h1>
      <p><time datetime="{{ page.article.config.published_at.to_rfc3339() }}">{{ page.article.config.published_at.date_naive() }}</time></p>
      <ul>
      {% for tag in page.article.config.tags %}
        <li>{{ tag }}</li>
      {% endfor %}
      </ul>
      {{ page.body_html|safe }}
    </article>
  </main>
</body>
</html>
