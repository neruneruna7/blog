[package]
name = "blog-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
typst-html-export = { path = "../typst-html-export" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
