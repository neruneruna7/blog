[package]
name = "blog-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.14"
camino = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde", "std"] }
walkdir = "2"

[dev-dependencies]
assert_fs = "1"
predicates = "3"
tempfile = "3"
