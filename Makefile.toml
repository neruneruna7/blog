[config]
default_to_workspace = false

[tasks.build-blog]
description = "Typstソースからgenerated配下のブログ成果物を作成する"
command = "cargo"
args = ["run", "-r","-p", "blog-compiler", "--", "build", "${@}"]

[tasks.typst-html-export]
description = "Typstライブラリ経由で文書をHTMLへ変換する"
command = "cargo"
args = ["run", "-p", "typst-html-export", "--bin", "typst-html-export"]

[tasks.assemble-public]
description = "frontend/publicをgenerated/public-rootへ統合する"
dependencies = ["build-blog"]
cwd = "frontend"
command = "pnpm"
args = ["run", "assemble-public"]

[tasks.new-article]
description = "新しいTypst記事の雛形を作成する"
command = "cargo"
args = ["run", "-p", "blog-compiler", "--", "new", "${@}"]

[tasks.test-blog]
description = "ブログコンパイラのRustテストを実行する"
command = "cargo"
args = ["test", "-p", "blog-compiler"]

[tasks.build-frontend]
description = "Astroでフロントエンドをビルドする"
dependencies = ["assemble-public"]
cwd = "frontend"
command = "pnpm"
args = ["exec", "astro", "build"]

[tasks.install-frontend]
description = "フロントエンドの依存関係をインストールする"
cwd = "frontend"
command = "pnpm"
args = ["install"]

[tasks.install-ci-fonts]
description = "CIマシンへTypst描画用フォントを導入する"
command = "bash"
args = ["scripts/install-ci-fonts.sh"]

[tasks.verify-fonts]
description = "Typstが必要なフォントを認識していることを検証する"
command = "bash"
args = ["scripts/verify-fonts.sh"]

[tasks.test-frontend]
description = "フロントエンドのビルドレベルテストを実行する"
cwd = "frontend"
command = "pnpm"
args = ["run", "test"]

[tasks.run-frontend]
description = "Astro開発サーバーを起動する"
command = "pnpm"
args = ["--dir", "frontend", "run", "dev"]

[tasks.dev-blog]
description = "Typst監視とAstro開発サーバーを並行して起動する"
dependencies = ["build-blog"]
run_task = { name = ["watch-blog", "run-frontend"], fork = true, parallel = true }

[tasks.build]
description = "ブログ成果物を生成してフロントエンドをビルドする"
dependencies = ["build-frontend"]

[tasks.test]
description = "Rustとフロントエンドのテストを実行する"
dependencies = ["test-blog", "test-frontend"]

[tasks.fmt]
description = "Rustコードをフォーマットする"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
description = "Rustのlintを実行する"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.check]
clear = true
description = "フォーマット，lint，テストを実行する"
dependencies = ["fmt", "clippy", "test-blog"]

[tasks.clean]
clear = true
description = "生成物を削除する"
script = '''
rm -rf generated
'''

[tasks.watch-blog]
description = "typst-src内の変更を監視し，ブログ成果物を再生成する．"
command = "watchexec"
args = [
  "--watch",
  "typst-src",

  "--debounce",
  "200ms",

  "--on-busy-update",
  "queue",

  "--postpone",

  "--",
  "cargo",
  "run",
  "-r",
  "-p",
  "blog-compiler",
  "--",
  "build",
]
