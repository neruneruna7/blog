[config]
default_to_workspace = false

[tasks.build-content]
description = "Typstソースからgenerated配下の中間生成物を作成する"
command = "cargo"
args = ["run", "-r","-p", "blog-compiler", "--", "build", "${@}"]

[tasks.typst-html-export]
description = "Typstライブラリ経由で文書をHTMLへ変換する"
command = "cargo"
args = ["run", "-p", "typst-html-export", "--bin", "typst-html-export"]

[tasks.assemble-public]
description = "frontend/publicをgenerated/public-rootへ統合する"
dependencies = ["build-content"]
cwd = "frontend"
command = "pnpm"
args = ["run", "assemble-public"]

[tasks.new-article]
description = "新しいTypst記事の雛形を作成する"
command = "cargo"
args = ["run", "-p", "blog-compiler", "--", "new", "${@}"]

[tasks.test-content]
description = "記事コンパイラのRustテストを実行する"
command = "cargo"
args = ["test", "-p", "blog-compiler"]

[tasks.build-site]
description = "Astroをビルド"
dependencies = ["assemble-public"]
cwd = "frontend"
command = "pnpm"
args = ["exec", "astro", "build"]

[tasks.frontend-install]
description = "フロントエンドの依存関係をインストールする"
cwd = "frontend"
command = "pnpm"
args = ["install"]

[tasks.install-ci-fonts]
description = "CIマシンへTypst描画用フォントを導入する"
command = "bash"
args = ["scripts/install-ci-fonts.sh"]

[tasks.verify-fonts]
description = "Typstが必要なフォントを認識していることを検証する"
command = "bash"
args = ["scripts/verify-fonts.sh"]

[tasks.test-site]
description = "フロントエンドのビルドレベルテストを実行する"
cwd = "frontend"
command = "pnpm"
args = ["run", "test"]

[tasks.run-site]
description = "Astro開発サーバーを起動"
cwd = "frontend"
command = "pnpm"
args = ["run", "dev"]

[tasks.build]
description = "記事コンテンツを生成してAstro静的サイトをビルドする"
dependencies = ["build-site"]

[tasks.test]
description = "Rustとフロントエンドのテストを実行する"
dependencies = ["test-content", "test-site"]

[tasks.fmt]
description = "Rustコードをフォーマットする"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
description = "Rustのlintを実行する"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.check]
clear = true
description = "フォーマット，lint，テストを実行する"
dependencies = ["fmt", "clippy", "test-content"]

[tasks.clean]
clear = true
description = "生成物を削除する"
script = '''
rm -rf generated
'''

[tasks.watch-content]
description = "typst-src内の変更を監視し，コンテンツを再生成する．"
command = "watchexec"
args = [
  "--watch",
  "typst-src",

  "--debounce",
  "200ms",

  "--on-busy-update",
  "queue",

  "--postpone",

  "--",
  "cargo",
  "run",
  "-r",
  "-p",
  "blog-compiler",
  "--",
  "build",
]
